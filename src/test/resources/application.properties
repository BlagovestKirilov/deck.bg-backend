# Stand-ins for the environment variables application.yml reads, so a test
# that boots the whole application (CacheServiceTest, BelotMatchmakingRaceTest)
# starts on a machine that has none of them — the CI runner, which runs the
# full suite before every deploy.
#
# A real environment variable still wins over these. That is why each of those
# tests also sets its own H2 datasource: on a developer's machine
# DB_URL_SANTASE names their real database, and Liquibase would migrate it.
DB_URL_SANTASE=jdbc:h2:mem:unused
DB_USERNAME=sa
DB_PASSWORD=
DB_DIALECT=org.hibernate.dialect.H2Dialect
JWT_SECRET=dGVzdC1vbmx5IEhNQUMga2V5OiBzaWducyB0b2tlbnMgaW5zaWRlIHRoZSB0ZXN0IHN1aXRlLCBub3doZXJlIGVsc2U=
JWT_EXPIRATION=3600000
JWT_REFRESH_EXPIRATION=86400000
SANTASE_MAIL_HOST=localhost
SANTASE_MAIL_PORT=2525
SANTASE_MAIL_USERNAME=test
SANTASE_MAIL_PASSWORD=test

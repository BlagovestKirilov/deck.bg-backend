databaseChangeLog:
  # The last step of moving santase and табла out of public: drop what 034,
  # 035, 038 and 039 copied.
  #
  # Shipped in the same release as those copies, by decision: nothing rolls
  # back past this changeset. The rollbacks of 034-039 copy into the tables
  # this drops, so once it has run `liquibase rollback before-stats-split` and
  # `before-game-split` stop here, and the only way back is a backup taken
  # before the deploy.
  #
  # The guard refuses to drop anything unless every old game is already in
  # its new schema, so a database that skipped a copy keeps its data. No
  # CASCADE: if anything else still points at these tables, the drop fails
  # rather than taking that with it. No rollback: Liquibase refuses to roll
  # back through this changeset, which is the truth.
  - changeSet:
      id: 042-drop-old-game-tables
      author: Blagovest Kirilov
      comment: Drop the public game tables santase and табла no longer use
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  missing bigint;
              BEGIN
                  SELECT count(*) INTO missing
                    FROM public.game g
                   WHERE (g.game_type = 'SANTASE' AND NOT EXISTS (SELECT 1 FROM santase.game n WHERE n.id = g.id))
                      OR (g.game_type = 'TABLA'   AND NOT EXISTS (SELECT 1 FROM tabla.game n WHERE n.id = g.id))
                      OR g.game_type NOT IN ('SANTASE', 'TABLA');
                  IF missing <> 0 THEN
                      RAISE EXCEPTION 'public.game: % games are not in their new schema; nothing dropped', missing;
                  END IF;

                  SELECT count(*) INTO missing
                    FROM public.user_game_stats s
                    JOIN public.users u ON u.id = s.user_id
                   WHERE (s.game_type = 'SANTASE' AND NOT EXISTS (SELECT 1 FROM santase.player_stats n WHERE n.username = u.username))
                      OR (s.game_type = 'TABLA'   AND NOT EXISTS (SELECT 1 FROM tabla.player_stats n WHERE n.username = u.username));
                  IF missing <> 0 THEN
                      RAISE EXCEPTION 'public.user_game_stats: % records are not in their new schema; nothing dropped', missing;
                  END IF;
              END $$;

              DROP TABLE public.game, public.game_deck, public.player_hand, public.game_state,
                         public.tabla_game_state, public.player, public.user_game_stats;

databaseChangeLog:
  # What belot remembers about a player between games.
  #
  # Its own table, in its own schema, keyed by username — belot keeps out of
  # GameType and out of users.stats for the reason written down in
  # docs/belot/BUILD.md: UserService loops over GameType.values() and would
  #500 every existing profile the day belot appeared there.
  #
  # Wins and losses only. Rating is an open question (does a 2v2 result move
  # both partners equally?), and a column filled with a number nobody has
  # agreed on is worse than no column.
  #
  # Additive: one new table in belot's own schema.
  - changeSet:
      id: 026-belot-player-stats
      author: Blagovest Kirilov
      comment: What belot remembers about a player
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE IF NOT EXISTS belot.player_stats (
                  id         UUID         PRIMARY KEY,
                  created_at TIMESTAMPTZ  NOT NULL,
                  updated_at TIMESTAMPTZ  NOT NULL,
                  username   VARCHAR(20)  NOT NULL UNIQUE,
                  games      INTEGER      NOT NULL DEFAULT 0,
                  wins       INTEGER      NOT NULL DEFAULT 0,
                  losses     INTEGER      NOT NULL DEFAULT 0,
                  CONSTRAINT belot_stats_counts_check
                      CHECK (games >= 0 AND wins >= 0 AND losses >= 0 AND wins + losses <= games)
              );

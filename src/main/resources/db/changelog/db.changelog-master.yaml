  # Santase and табла move into schemas of their own, as belot has, in
  # releases that each stand alone: expand into the new schema, copy, verify,
  # and only in a later release drop what was copied. Each phase starts with
  # a tag to roll back to.
  #   032-036  the records: santase.player_stats, tabla.player_stats
  #   037-040  the games: santase.game/seat/game_state/hand/deck, tabla.game/seat/game_state
  #   041      drops the public tables 034-039 copied from. Not included yet:
  #            it goes in a later release, once 032-040 have been live long
  #            enough that nobody will roll them back — see the file.
  - include:
      file: db/changelog/changes/032-tag-before-stats-split.yaml

  - include:
      file: db/changelog/changes/033-santase-tabla-schemas.yaml

  - include:
      file: db/changelog/changes/034-santase-player-stats.yaml

  - include:

spring:
  profiles:
    active: dev

  application:
    name: SantaseService

  jackson:
    time-zone: Europe/Sofia

  datasource:
    url: ${DB_URL_SANTASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  threads:
    virtual:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: Europe/Sofia
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Pinned rather than taken from the search path, which starts with the
    # role's own name: a role ever named after one of the schemas the games
    # now have would send Liquibase looking for its history in the wrong place.
    default-schema: public
    liquibase-schema: public
  mail:
    host: ${SANTASE_MAIL_HOST}
    port: ${SANTASE_MAIL_PORT}
    username: ${SANTASE_MAIL_USERNAME}
    password: ${SANTASE_MAIL_PASSWORD}

# The scheduled jobs. Defaults also live in SchedulingProperties, so a
# profile that says nothing still starts with these timings.
deck:
  scheduling:
    pool-size: 2
    shutdown-grace: PT30S
    expired-links:
      interval: PT5M
      initial-delay: PT1M

  # Belot. Defaults also live in BelotProperties.
  belot:
    # How long a seat may think before the table acts for them.
    turn-timeout: PT30S
    # How long a finished trick stays out before the next can be led. The
    # client shows it held and then swept to whoever took it in this time;
    # a lead inside it would pull the trick off every other screen before
    # anyone saw who took it. Matches .belot__trick.is-collected.
    trick-pause: PT1.6S
    # How long the player cutting has to touch the deck before it is cut for
    # them, and how long after the cut the deal takes to show before the
    # bidding clock starts.
    cut-timeout: PT8S
    deal-pause: PT3S
    # After a hand is played out, the last trick is shown being taken and the
    # count is put up; the cut clock waits for both.
    hand-pause: PT11S

jwt:
  secret-key: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

# Only health, and only whether it is up — never the details of why.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ============================================================
# DEV PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    hikari:
      pool-name: SantaseHikariDev
      maximum-pool-size: 12
      minimum-idle: 4
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
      validation-timeout: 3000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: WARN


# ============================================================
# PROD PROFILE
# ============================================================
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      pool-name: SantaseHikariProd
      maximum-pool-size: 4
      minimum-idle: 2
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 1700000
      keepalive-time: 300000
      auto-commit: false
      validation-timeout: 3000
      leak-detection-threshold: 15000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${DB_DIALECT}
        jdbc:
          time_zone: Europe/Sofia

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

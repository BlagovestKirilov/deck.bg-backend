name: Build and Deploy to EC2 (Ubuntu 22 + Java 25)

on:
  push:
    branches:
      - master  # Trigger on push to master branch

# The default GITHUB_TOKEN is write-all on older repositories. Nothing here
# writes to the repository, so it is read-only: a compromised action in this
# job cannot push a commit or a release with it.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      # Not -DskipTests. A suite that does not run before a deploy is a
      # suite that stops being true, and the whole of it takes about a
      # minute. If it goes red, the deploy stops here rather than on the
      # server.
      - name: Build Spring Boot JAR
        run: mvn clean package

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/santase_backend:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/santase_backend:latest

      - name: Copy docker-compose.yml to EC2
        # A released tag, not @master: that tag moves, and whatever it moves
        # to runs here with the EC2 deploy key. Pinning to the commit SHA is
        # stronger still.
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/santase"

      - name: Deploy on EC2 (Ubuntu 22)
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            # 1. Move to the application directory
            cd /home/ubuntu/santase

            echo "Logging into Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "Creating environment file..."
            # Using quotes around 'EOF' prevents the shell from trying to interpret variables locally
            cat << 'EOF' > .env
            DB_URL_SANTASE=${{ secrets.DB_URL_SANTASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DIALECT=${{ secrets.DB_DIALECT }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}
            JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            SANTASE_MAIL_HOST=${{ secrets.SANTASE_MAIL_HOST }}
            SANTASE_MAIL_PORT=${{ secrets.SANTASE_MAIL_PORT }}
            SANTASE_MAIL_USERNAME=${{ secrets.SANTASE_MAIL_USERNAME }}
            SANTASE_MAIL_PASSWORD=${{ secrets.SANTASE_MAIL_PASSWORD }}
            EOF

            echo "Pulling latest images..."
            # This ensures you get the image you just pushed to Docker Hub
            docker compose pull

            echo "Recreating containers..."
            # Without this the pull above is inert: the old container keeps
            # running the previous image. This is why the backend stayed on a
            # February build for six months.
            docker compose up -d

            echo "Reloading nginx_proxy so it re-resolves container IPs..."
            # nginx caches upstream IPs from config load; a recreated container
            # gets a new address and the proxy would 502 until reloaded.
            docker exec nginx_proxy nginx -s reload || echo "WARNING: nginx_proxy reload failed - check the proxy"

            echo "Cleaning up unused Docker data..."
            docker image prune -f

      - name: Verify backend health
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/santase

            # The backend publishes no ports — nginx reaches it over the docker
            # network — so the probe runs inside that network too, from a
            # throwaway container. The JRE image carries no curl of its own.
            # The Host header says localhost, not santase_backend. Tomcat
            # rejects a host containing an underscore outright — "The character
            # [_] is never valid in a domain name" — so every probe came back
            # 400 while the backend was perfectly healthy. The connection still
            # goes to the container; only the header it sees changes.
            probe() {
              docker run --rm --network app_santase_network curlimages/curl:latest \
                "$@" -H "Host: localhost" --max-time 5 \
                http://santase_backend:8080/actuator/health 2>/dev/null || true
            }

            echo "Waiting for the backend to report healthy..."
            for i in $(seq 1 12); do
              status=$(probe -s -o /dev/null -w "%{http_code}")
              if [ "$status" = "200" ]; then
                echo "Backend healthy after $((i*5))s"
                probe -s
                echo ""
                exit 0
              fi
              echo "Attempt $i/12: status=$status, retrying in 5s..."
              sleep 5
            done

            echo "FATAL: backend not healthy after 60s"
            docker compose logs --tail=50 backend
            exit 1
